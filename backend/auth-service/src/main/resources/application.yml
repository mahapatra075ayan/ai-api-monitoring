spring.application.name=auth-service

spring
  datasource:
    url: jdbc:postgresql://localhost:5432/authdb
    username: postgres
    password: [PASSWORD]

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server
  port: 8081